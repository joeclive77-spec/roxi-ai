name: Feature request
description: Suggest an idea for Roxi AI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you'd like to see and why it matters.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's the user pain?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? What does the API/UX look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why this one is better.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Backend
        - Mobile
        - Both
        - Docs / Tooling
    validations:
      required: true
